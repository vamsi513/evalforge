name: Release Gate Decision

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evalgate-decision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install CI script dependencies
        run: python -m pip install --upgrade pip httpx

      - name: Enforce release-gate decision
        # No `if:` guard — a misconfigured/missing EVALFORGE_API_URL or
        # EVALFORGE_API_KEY must fail this step loudly. The previous
        # `if: vars.EVALFORGE_API_URL != ''` silently skipped enforcement
        # whenever that variable was unset (which it always was — this repo
        # never had it configured), so every historical "Release Gate
        # Decision" green check was a skip, not a passed gate.
        env:
          EVALFORGE_API_URL: ${{ vars.EVALFORGE_API_URL }}
          EVALFORGE_DATASET: ${{ vars.EVALFORGE_DATASET }}
          EVALFORGE_EXPERIMENT: ${{ vars.EVALFORGE_EXPERIMENT }}
          EVALFORGE_WORKSPACE: ${{ vars.EVALFORGE_WORKSPACE }}
          EVALFORGE_API_KEY: ${{ secrets.EVALFORGE_API_KEY }}
          EVALFORGE_REQUIRE_GATE_DECISION: ${{ vars.EVALFORGE_REQUIRE_GATE_DECISION }}
          EVALFORGE_REPORT_PATH: artifacts/release-gate-report.md
        run: |
          python scripts/ci/check_release_gate.py

      - name: Upload release-gate report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: artifacts/release-gate-report.md
          if-no-files-found: warn
