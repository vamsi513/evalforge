name: E2E

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      # The suite starts both halves of the app itself, through Playwright's
      # webServer block, so the job needs Node and Python side by side.
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend
        run: pip install -e "."

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # No secrets. JUDGE_PROVIDER=mock routes scoring to the in-process
      # heuristic evaluators and DEFAULT_USER_ROLE=admin grants the write access
      # the demo flow needs; both are set by playwright.config.ts for the
      # servers it starts, and neither is an application default.
      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_PYTHON: python

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
