name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-evalforge
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]" "ruff==0.9.10"

      - name: Lint
        run: ruff check app tests scripts training

      - name: Security scan
        run: pip install pip-audit && python scripts/ci/check_pip_audit.py

      - name: Build Docker image
        run: docker build -t evalforge-api:${{ github.sha }} .

      - name: Run tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # SSH on the host's security group is locked to a single home IP, so the
    # runner (a different IP every run) can't reach port 22 by default. Open
    # it just for this runner's own IP for the life of the job, then close it
    # again in a cleanup step that runs even if the deploy fails.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      SG_ID: sg-0c7f5612c7d11e8f4

    steps:
      - name: Allow this runner's IP through SSH
        run: |
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com)/32"
          echo "RUNNER_CIDR=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP,Description='CI runner ${{ github.run_id }}'}]"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/evalforge

            # Save running image for rollback
            OLD_IMAGE=$(sudo docker inspect evalforge-api --format='{{.Config.Image}}' 2>/dev/null || echo "")

            # Deploy exact tested commit
            git fetch origin
            git checkout --detach ${{ github.sha }}

            sudo docker build -t evalforge-api:${{ github.sha }} .
            sudo docker stop evalforge-api || true
            sudo docker rm evalforge-api || true
            sudo mkdir -p /home/ec2-user/evalforge/data
            sudo docker run -d --name evalforge-api --network host --env-file .env \
              -v /home/ec2-user/evalforge/data:/app/data \
              evalforge-api:${{ github.sha }} \
              uvicorn app.main:app --host 0.0.0.0 --port 8001 --root-path /evalforge

            # Health check — 12 attempts × 5 s = 60 s window
            for attempt in $(seq 1 12); do
              if curl --fail --silent http://localhost:8001/health; then
                echo "Health check passed on attempt $attempt"
                # `docker image prune -f` only removes dangling images, but every
                # deploy tags a new image by commit SHA, so old deploys are never
                # dangling and pile up until the disk fills. Explicitly drop every
                # tagged evalforge-api image except the one just deployed and the
                # one it replaced (kept for rollback).
                KEEP_IMAGE="evalforge-api:${{ github.sha }}"
                sudo docker images evalforge-api --format '{{.Repository}}:{{.Tag}}' | while read -r img; do
                  if [ "$img" != "$KEEP_IMAGE" ] && [ "$img" != "$OLD_IMAGE" ]; then
                    sudo docker rmi "$img" || true
                  fi
                done
                # Best-effort: buildkit runs its own background GC right after a
                # build, which can hold this lock and make prune fail with "a
                # prune operation is already running" even though the deploy
                # itself succeeded (image already removed above). Non-fatal.
                sudo docker image prune -f || true
                # The image prune above only clears final tagged images -- it
                # does NOT touch BuildKit's separate intermediate build cache
                # (every RUN layer from every build, content-addressed and
                # decoupled from image tags). That cache had never been
                # cleared once and grew to 8+GB of 100%-reclaimable data,
                # which is what actually filled the disk and broke a deploy
                # (verified via `docker system df` on the host). Keep the
                # last 24h of cache so same-day rebuilds still get a
                # warm-cache speedup; anything older is reclaimed.
                sudo docker builder prune -af --filter until=24h || true
                exit 0
              fi
              echo "Attempt $attempt failed, retrying in 5s..."
              sleep 5
            done

            # Rollback to previous image
            echo "Health check failed — rolling back"
            sudo docker logs evalforge-api --tail 50
            sudo docker stop evalforge-api || true
            sudo docker rm evalforge-api || true
            if [ -n "$OLD_IMAGE" ]; then
              sudo docker run -d --name evalforge-api --network host --env-file .env \
                -v /home/ec2-user/evalforge/data:/app/data \
                "$OLD_IMAGE" \
                uvicorn app.main:app --host 0.0.0.0 --port 8001 --root-path /evalforge
              echo "Rolled back to $OLD_IMAGE"
            fi
            exit 1

      - name: Revoke this runner's IP from SSH
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR" || true
